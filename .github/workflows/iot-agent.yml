name: iot-agent tests

on:
  push:
    paths:
      - 'iot-agent/**'
      - '.github/workflows/iot-agent.yml'
  pull_request:
    paths:
      - 'iot-agent/**'
      - '.github/workflows/iot-agent.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: iot-agent/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
