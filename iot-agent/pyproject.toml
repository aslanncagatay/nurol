[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nurol-iot-agent"
version = "0.0.1"
description = "LangGraph state machine that triages IoT telemetry for the Nurol platform"
requires-python = ">=3.10"
dependencies = ["langgraph>=1.2,<2.0"]

[project.optional-dependencies]
rabbitmq = ["pika>=1.3"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
